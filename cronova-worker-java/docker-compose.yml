# 本地测试 docker-compose（Java 执行器）
services:
  cronova-worker-java:
    image: cronova-worker-java:1.0
    network_mode: host
    container_name: cronova-worker-java
    restart: always
    env_file:
      - .env
    working_dir: /app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
