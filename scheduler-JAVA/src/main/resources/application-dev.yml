server:
  port: 8085 # 应用监听端口
  tomcat:
    max-swallow-size: -1  # 不限制请求体大小

# 环境变量配置说明（均可通过环境变量覆盖，未设置时使用默认值）：
#   DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD —— MySQL
#   REDIS_HOST/REDIS_PORT/REDIS_DATABASE/REDIS_PASSWORD —— Redis
#   ROCKETMQ_NAME_SERVER/ROCKETMQ_PRODUCER_GROUP/ROCKETMQ_CONSUMER_GROUP —— RocketMQ
#   MINIO_ENDPOINT/MINIO_ACCESS_KEY/MINIO_SECRET_KEY/MINIO_BUCKET —— MinIO

# 数据库配置 (连接开发数据库)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:scheduler}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    # Redis 配置 (连接开发Redis)
    redis:
      database: ${REDIS_DATABASE:1} # 开发环境使用1号库，与生产环境隔离
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}

# MyBatis-Plus 开发环境特定配置
mybatis-plus:
  # 开发环境开启SQL日志打印，方便调试
  configuration:
     log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl




# Sa-Token 开发环境特定配置
sa-token:
  timeout: 86400 # 开发时Token有效期可以设置短一些，例如1天

springdoc:
  swagger-ui:
    enabled: true # 开发环境开启Swagger UI
    url: /v3/api-docs

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:scheduler-producer}
  consumer:
    group: ${ROCKETMQ_CONSUMER_GROUP:scheduler-consumer}

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${MINIO_ACCESS_KEY:changeme}
  secretKey: ${MINIO_SECRET_KEY:changeme}
  bucket-name-scripts: ${MINIO_BUCKET:task-engine}
  bucket-name: ${MINIO_BUCKET:task-engine}

