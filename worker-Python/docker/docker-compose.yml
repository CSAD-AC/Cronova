# 本地测试docker-compose
services:
  sjdt-worker:
    image: sjdt-worker:1.0
    network_mode: host
    container_name: sjdt-worker
    restart: always
    env_file:
      - .env
    working_dir: /app
    command: ["python", "main.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
