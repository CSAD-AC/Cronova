services:
  sjdt-worker:
    image: sjdt-worker:1.0
    network_mode: host
    container_name: sjdt-worker
    restart: always
    env_file:
      - .env
    volumes:
      - ../../jupyter:/app/jupyter
    working_dir: /app/jupyter
    #command: tail -f /dev/null
    command: ["python", "../main.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
