[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cronova-utils"
version = "0.1.0"
description = "cronova-task-engine utilities"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/example/cronova-utils"

[tool.setuptools.packages.find]
where = ["."]
include = ["cronova_utils*"]
