spring:
  # 默认激活开发环境配置
  profiles:
    active: dev
  application:
    name: scheduler
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB      # 单个文件最大100MB
      max-request-size: 200MB   # 请求最大200MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  web:
    resources:
      add-mappings: false   # 关闭默认的 /static、/public、/resources、/META-INF/resources 映射
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss
  # 数据库版本管理（Flyway）
  flyway:
    enabled: true
    # 迁移脚本位置
    locations: classpath:db/migration
    # V1 为当前全量 schema（含分片三列），属重构基线；新库自动建全量
    baseline-on-migrate: true
    # 存量库（schema 非空）视为已按 V1 基线，避免启动即失败
    baseline-version: 1
# MyBatis-Plus 通用配置
mybatis-plus:
  # Mapper.xml文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类别名扫描路径
  type-aliases-package: com.cronova.scheduler.domain.po
  # 全局配置
  global-config:
    db-config:
      # 主键类型统一使用UUID
      id-type: assign_uuid

# Sa-Token 通用配置
sa-token:
  # Token名称 (出现在Cookie或Header中的key)
  token-name: "Sa-Token"
  # Token风格
  token-style: "simple-uuid"
  # 在创建 Token 时就将当前账号的 Session 会话创建好
  is-create-session: true
  # 从请求头中读取 Token
  is-read-header: true

# 任务超时配置（支持环境变量覆盖）
cronova:
  security:
    # Worker 全局注册令牌：首次注册/重注册时必须携带 X-Register-Token 与该值一致；
    # 防止未授权方通过 /api/worker/register 免费领取 AKSK；留空时注册接口 fail-closed。
    worker-register-token: ${WORKER_REGISTER_TOKEN:}
  timeout:
    # 派发超时（秒）：run 保持 pending 超过该值判定派发失败
    dispatch-seconds: ${CRONOVA_TIMEOUT_DISPATCH_SECONDS:60}
    # 执行总时长上限（秒）：任务级 timeoutSeconds 配置了则优先使用
    execution-max-seconds: ${CRONOVA_TIMEOUT_EXECUTION_MAX_SECONDS:3600}
    # 无心跳阈值（秒）：执行期间超过该值无状态上报判定超时
    execution-heartbeat-seconds: ${CRONOVA_TIMEOUT_EXECUTION_HEARTBEAT_SECONDS:30}

